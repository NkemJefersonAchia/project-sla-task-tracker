# 8G heap + 4G metaspace is the Flutter template default. With the IDE and an
# emulator running alongside it, that over-commits memory and makes Android
# Studio crawl. 4G/1G is comfortable for an app this size.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Reuse the daemon and build modules in parallel - both cut rebuild time.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
